[project]
name = "begamer-cloudflare"
version = "0.1.0"
description = "Cloudflare Workers adapter for BEGAMER"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  # Pyodide 0.28.3 ships this matching WebAssembly wheel pair.
  "pydantic==2.10.6",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.9",
  "workers-py>=1.16.4",
  "workers-runtime-sdk>=0.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]
